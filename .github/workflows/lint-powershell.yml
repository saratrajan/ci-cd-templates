# Reusable: lint PowerShell with PSScriptAnalyzer (PowerShell is already installed on GitHub-hosted runners).
name: PowerShell lint

on:
  workflow_call:
    inputs:
      path:
        description: Folder to search for .ps1, .psm1 and .psd1 files.
        type: string
        default: "."
      severity:
        description: Severities that fail the job, separated by commas (Error, Warning, Information).
        type: string
        default: "Error,Warning"
      settings:
        description: Optional path to a PSScriptAnalyzer settings file in the calling repository.
        type: string
        default: ""
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        shell: pwsh
        env:
          LINT_PATH: ${{ inputs.path }}
          SEVERITY: ${{ inputs.severity }}
          SETTINGS: ${{ inputs.settings }}
        run: |
          $files = Get-ChildItem -Path $env:LINT_PATH -Recurse -File -Include *.ps1, *.psm1, *.psd1 |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          if (-not $files) { Write-Host "No PowerShell files found under $env:LINT_PATH"; exit 0 }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $options = @{ Severity = $env:SEVERITY -split ',' | ForEach-Object { $_.Trim() } }
          if ($env:SETTINGS) { $options.Settings = $env:SETTINGS }
          Write-Host "Linting $($files.Count) file(s)"
          $findings = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName @options }
          if ($findings) {
            $findings | Format-Table -AutoSize -Wrap ScriptName, Line, Severity, RuleName, Message | Out-String -Width 200 | Write-Host
            foreach ($f in $findings) { Write-Host "::error file=$($f.ScriptPath),line=$($f.Line)::$($f.RuleName): $($f.Message)" }
            exit 1
          }
          Write-Host "No findings."
