# Reusable: static analysis with CodeQL. Results appear in the repository's
# Security tab. The calling workflow must grant security-events write.
# Free for public repositories; private ones need GitHub Advanced Security.
name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: A JSON list of languages to analyse, for example '["python"]' or '["java-kotlin", "javascript-typescript"]'.
        type: string
        required: true
      build-mode:
        description: none for interpreted languages, autobuild to let CodeQL build compiled ones.
        type: string
        default: none
      queries:
        description: Query suite (default, security-extended or security-and-quality).
        type: string
        default: security-extended
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: analyse (${{ matrix.language }})
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ inputs.queries }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
