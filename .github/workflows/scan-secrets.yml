# Reusable: scan the commits of a push or pull request for secrets with gitleaks.
# Free for repositories owned by a personal account. A repository owned by an
# organisation must pass a licence key as the GITLEAKS_LICENSE secret.
name: Secret scan

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
    secrets:
      GITLEAKS_LICENSE:
        description: Only needed for repositories owned by an organisation.
        required: false

# The calling workflow must grant at least these two.
permissions:
  contents: read
  pull-requests: read   # to list the commits of a pull request

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, so every commit in the range is scanned
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
