# Checks for this repository itself: the workflow files are valid, and no secret is committed.
name: Self check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  secrets:
    name: Secret scan
    uses: ./.github/workflows/secret-scan.yml
