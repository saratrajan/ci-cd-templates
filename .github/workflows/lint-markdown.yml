# Reusable: lint Markdown with markdownlint. Rules come from the calling
# repository's .markdownlint.yaml, and folders to skip from its
# .markdownlintignore, if it has them.
name: Markdown lint

on:
  workflow_call:
    inputs:
      globs:
        description: Files to lint, as quoted glob patterns separated by spaces.
        type: string
        default: '"**/*.md"'
      markdownlint-version:
        description: Version of the markdownlint command-line tool to use.
        type: string
        default: "0.50.1"
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        env:
          GLOBS: ${{ inputs.globs }}
          TOOL: markdownlint-cli@${{ inputs.markdownlint-version }}
        # The globs come from the calling workflow file and are expanded by the tool, not the shell.
        run: eval "npx --yes \"\$TOOL\" $GLOBS"
